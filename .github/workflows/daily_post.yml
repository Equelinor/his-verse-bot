name: Daily Bible Verse Post

on:
  schedule:
    - cron: '0 11 * * *'   # 2:00 PM Bahrain — verse post
    - cron: '0 17 * * *'   # 8:00 PM Bahrain — engagement post
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (no posting)?'
        default: 'false'
      verse_id:
        description: 'Force verse ID (optional)'
        default: ''
      mode:
        description: 'Post mode: verse or engagement'
        default: 'verse'

jobs:
  post_verse:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update --fix-missing && sudo apt-get install -y ffmpeg --fix-missing
          pip install Pillow requests
      - name: Restore verse rotation state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: verse-state-${{ github.run_number }}
          restore-keys: verse-state-
      - name: Restore engagement rotation state
        uses: actions/cache@v4
        with:
          path: data/engagement_state.json
          key: engagement-state-${{ github.run_number }}
          restore-keys: engagement-state-

      - name: Determine post mode
        id: mode
        run: |
          # Priority 1: manual override via workflow_dispatch
          if [ "${{ github.event.inputs.mode }}" = "engagement" ]; then
            echo "MODE=engagement" >> "$GITHUB_ENV"
            echo "→ Mode: engagement (manual override)"
          elif [ "${{ github.event.inputs.mode }}" = "verse" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=verse" >> "$GITHUB_ENV"
            echo "→ Mode: verse (manual override)"
          # Priority 2: which cron schedule actually fired this run —
          # reliable regardless of execution delay, unlike checking wall-clock hour
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "MODE=engagement" >> "$GITHUB_ENV"
            echo "→ Mode: engagement (matched 17:00 UTC schedule)"
          else
            echo "MODE=verse" >> "$GITHUB_ENV"
            echo "→ Mode: verse (matched 11:00 UTC schedule or default)"
          fi

      - name: Run bot
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USERNAME: Equelinor
          GITHUB_REPO: his-verse-bot
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then ARGS="$ARGS --preview"; fi
          if [ -n "${{ github.event.inputs.verse_id }}" ]; then ARGS="$ARGS --verse ${{ github.event.inputs.verse_id }}"; fi
          echo "Running bot.py with mode=$MODE"
          python bot.py $ARGS --mode $MODE

      - name: Save verse rotation state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: verse-state-${{ github.run_number }}
      - name: Save engagement rotation state
        uses: actions/cache@v4
        with:
          path: data/engagement_state.json
          key: engagement-state-${{ github.run_number }}
      - name: Upload post image
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_number }}
          path: output/*.jpg
          retention-days: 30
