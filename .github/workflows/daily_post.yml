name: Daily Bible Verse Post

on:
  schedule:
    - cron: '30 23 * * *'  # 2:30 AM Bahrain (next day) — Before You Sleep
    - cron: '0 11 * * *'   # 2:00 PM Bahrain — verse post (unchanged)
    - cron: '0 14 * * *'   # 5:00 PM Bahrain — What Do You Need Today?
    - cron: '0 17 * * *'   # 8:00 PM Bahrain — engagement post (unchanged)
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (no posting)?'
        default: 'false'
      verse_id:
        description: 'Force verse ID (optional, verse mode only)'
        default: ''
      mode:
        description: 'Post mode: verse, engagement, night, or morning'
        default: 'verse'

# Prevents two runs (e.g. a scheduled trigger and a manual dispatch) from
# reading/writing the shared state cache at the same time, which could
# otherwise cause the same content to be selected twice.
concurrency:
  group: his-verse-bot-posting
  cancel-in-progress: false

jobs:
  post_verse:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update --fix-missing && sudo apt-get install -y ffmpeg --fix-missing
          pip install Pillow requests

      # Explicit restore/save (not the ambiguous single cache@v4 action) so
      # it's unambiguous exactly when state is read vs written.
      - name: Restore verse rotation state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: verse-state-${{ github.run_number }}
          restore-keys: verse-state-
      - name: Restore engagement rotation state
        uses: actions/cache/restore@v4
        with:
          path: data/engagement_state.json
          key: engagement-state-${{ github.run_number }}
          restore-keys: engagement-state-
      - name: Restore night rotation state
        uses: actions/cache/restore@v4
        with:
          path: data/night_state.json
          key: night-state-${{ github.run_number }}
          restore-keys: night-state-
      - name: Restore morning rotation state
        uses: actions/cache/restore@v4
        with:
          path: data/morning_state.json
          key: morning-state-${{ github.run_number }}
          restore-keys: morning-state-
      - name: Restore same-day Scripture reservations
        uses: actions/cache/restore@v4
        with:
          path: data/daily_scripture_reservations.json
          key: scripture-reservations-${{ github.run_number }}
          restore-keys: scripture-reservations-

      - name: Determine post mode
        id: mode
        run: |
          if [ "${{ github.event.inputs.mode }}" = "engagement" ]; then
            echo "MODE=engagement" >> "$GITHUB_ENV"
          elif [ "${{ github.event.inputs.mode }}" = "night" ]; then
            echo "MODE=night" >> "$GITHUB_ENV"
          elif [ "${{ github.event.inputs.mode }}" = "morning" ]; then
            echo "MODE=morning" >> "$GITHUB_ENV"
          elif [ "${{ github.event.inputs.mode }}" = "verse" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=verse" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            echo "MODE=night" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "MODE=morning" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "MODE=engagement" >> "$GITHUB_ENV"
          else
            echo "MODE=verse" >> "$GITHUB_ENV"
          fi
          echo "Resolved mode: $MODE"

      - name: Run bot
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USERNAME: Equelinor
          GITHUB_REPO: his-verse-bot
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then ARGS="$ARGS --preview"; fi
          if [ -n "${{ github.event.inputs.verse_id }}" ]; then ARGS="$ARGS --verse ${{ github.event.inputs.verse_id }}"; fi
          python bot.py $ARGS --mode $MODE

      # Explicit save — always runs (even on failure) so a partial state
      # update from a failed-but-partway run isn't silently lost, and the
      # reservation release-on-failure logic in bot.py is actually persisted.
      - name: Save verse rotation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: verse-state-${{ github.run_number }}
      - name: Save engagement rotation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/engagement_state.json
          key: engagement-state-${{ github.run_number }}
      - name: Save night rotation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/night_state.json
          key: night-state-${{ github.run_number }}
      - name: Save morning rotation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/morning_state.json
          key: morning-state-${{ github.run_number }}
      - name: Save same-day Scripture reservations
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/daily_scripture_reservations.json
          key: scripture-reservations-${{ github.run_number }}

      - name: Check content inventory
        if: always()
        run: python check_inventory.py

      - name: Upload post image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_number }}
          path: output/*.jpg
          retention-days: 30
          if-no-files-found: ignore
